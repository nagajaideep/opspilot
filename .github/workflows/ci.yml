name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit + Testcontainers integration tests (Docker is available on ubuntu-latest).
      - run: mvn -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend (types, tests incl. axe, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t opspilot-backend -t opspilot-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t opspilot-frontend -t opspilot-frontend:${{ github.sha }} frontend
      - name: Smoke test the full stack
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null && curl -sf http://localhost:8080/actuator/health >/dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8080/actuator/health
          curl -sf -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' \
               -d '{"username":"riya","password":"opspilot-demo"}' | grep -q token
        env:
          COMPOSE_PROJECT_NAME: opspilot
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
