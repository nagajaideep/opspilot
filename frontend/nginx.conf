server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Same origin for the browser: /api goes to the backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # agent review can take a while with an LLM
    }

    # NOTE: no add_header inside location blocks. In nginx, ANY add_header in a location
    # discards all add_header lines inherited from server{} - the security headers would vanish.
    # "expires" sets Cache-Control without that side effect.

    # Hashed assets can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths serve index.html, React Router handles them.
    location / {
        try_files $uri /index.html;
        expires -1;   # Cache-Control: no-cache, so new deploys show up immediately
    }
}
